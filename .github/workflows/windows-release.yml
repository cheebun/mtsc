name: Windows build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add $env:TARGET

      - name: Run tests
        run: cargo test --release --target $env:TARGET

      - name: Build release executable
        run: cargo build --release --target $env:TARGET

      - name: Package Windows archive
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = "${{ github.sha }}".Substring(0, 7)
          }

          $packageName = "ros-serialgen-$version-windows-x86_64"
          $stage = Join-Path "dist" $packageName
          $archive = Join-Path "dist" "$packageName.zip"
          $checksum = "$archive.sha256"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/ros-serialgen.exe" $stage
          Copy-Item "README.md", "LICENSE", "keys.example.toml" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -CompressionLevel Optimal

          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $packageName.zip" | Set-Content -Encoding ascii $checksum

          "archive_name=$packageName.zip" >> $env:GITHUB_OUTPUT
          "checksum_name=$packageName.zip.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/${{ steps.package.outputs.archive_name }}
            dist/${{ steps.package.outputs.checksum_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
