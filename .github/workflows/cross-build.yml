name: Cross-platform build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: mtsc-linux-x86_64
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            artifact: mtsc-windows-x86_64.exe
          - target: x86_64-apple-darwin
            runner: ubuntu-latest
            artifact: mtsc-macos-x86_64
          - target: aarch64-apple-darwin
            runner: ubuntu-latest
            artifact: mtsc-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild
        if: runner.os != 'Windows'
        run: |
          python3 -m pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Cross-build Linux or macOS
        if: runner.os != 'Windows'
        run: cargo zigbuild --release --target ${{ matrix.target }}

      # cargo-zigbuild supports Linux and macOS targets, not Windows targets.
      - name: Build Windows natively
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -f "target/${{ matrix.target }}/release/mtsc.exe" ]; then
            cp "target/${{ matrix.target }}/release/mtsc.exe" "dist/${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/mtsc" "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
