name: Cross-platform build (zig)

# Manual-only: no push/pull_request/tag triggers, so this never runs automatically.
# Trigger it by hand from the Actions tab (or `gh workflow run cross-build.yml`) when
# a real multi-platform release build is actually needed.
on:
  workflow_dispatch:

jobs:
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: mtsc-linux-x86_64
          - target: x86_64-pc-windows-gnu
            artifact: mtsc-windows-x86_64.exe
          - target: x86_64-apple-darwin
            artifact: mtsc-macos-x86_64
          - target: aarch64-apple-darwin
            artifact: mtsc-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Collect binary
        run: |
          mkdir -p dist
          if [ -f "target/${{ matrix.target }}/release/mtsc.exe" ]; then
            cp "target/${{ matrix.target }}/release/mtsc.exe" "dist/${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/mtsc" "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
