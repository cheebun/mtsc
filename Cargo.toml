[package]
name = "mtsc"
version = "0.4.0"
edition = "2021"
description = "RouterOS L6 Serial Generator & License Key Converter"

[[bin]]
name = "mtsc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
curve25519-dalek = "4"
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
opt-level = 3
lto = true
